<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanlucid MT5 Pro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen p-4 md:p-8">

    <div class="max-w-4xl mx-auto">
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-gray-700 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-blue-400">Sanlucid MT5 Pro</h1>
                <p class="text-sm text-gray-400 mt-1">Cloudflare KV Remote Control Panel</p>
            </div>
            <div class="flex items-center space-x-3">
                <span class="text-sm font-semibold">STATUS BOT:</span>
                <label class="relative inline-flex items-center cursor-pointer">
                    <input type="checkbox" id="IsBotActive" class="sr-only peer" checked>
                    <div class="w-14 h-7 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-6 after:w-6 after:transition-all peer-checked:bg-green-500"></div>
                </label>
            </div>
        </div>

        <form id="botSettingsForm" class="space-y-6">
            
            <!-- SECTION 1: Pengaturan Entry -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <h2 class="text-xl font-semibold mb-4 text-blue-300">1. Pengaturan Entry</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Lot Size</label>
                        <input type="number" id="LotSize" step="0.01" value="0.01" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Jumlah Entry (Layer)</label>
                        <input type="number" id="NumEntries" step="1" value="1" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">EMA Period</label>
                        <input type="number" id="EmaPeriod" step="1" value="200" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Magic Number</label>
                        <input type="number" id="MagicNumber" step="1" value="123456" class="w-full bg-gray-700 border border-gray-600 rounded p-2 focus:ring-blue-500 focus:border-blue-500">
                    </div>
                </div>
            </div>

            <!-- SECTION 2: SL & TP -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-blue-300">2. Target & Risiko (USD)</h2>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="UseVirtualSLTP" checked class="w-5 h-5 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500">
                        <span class="text-sm font-semibold">Mode Ghaib (Virtual)</span>
                    </label>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Stop Loss ($) - Isi 0 jika off</label>
                        <input type="number" id="StopLossUSD" step="0.1" value="10.0" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-red-400 focus:ring-red-500 focus:border-red-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Take Profit ($) - Isi 0 jika off</label>
                        <input type="number" id="TakeProfitUSD" step="0.1" value="100.0" class="w-full bg-gray-700 border border-gray-600 rounded p-2 text-green-400 focus:ring-green-500 focus:border-green-500">
                    </div>
                </div>
            </div>

            <!-- SECTION 3: Trailing Stop -->
            <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-blue-300">3. Trailing Stop Bertingkat</h2>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="UseTrailing" class="w-5 h-5 text-blue-600 bg-gray-700 border-gray-600 rounded focus:ring-blue-500">
                        <span class="text-sm font-semibold">Aktifkan Trailing</span>
                    </label>
                </div>
                
                <div class="grid grid-cols-2 gap-x-4 gap-y-3">
                    <div class="text-sm text-gray-400 font-semibold">Jika Profit Menyentuh ($)</div>
                    <div class="text-sm text-gray-400 font-semibold">Kunci Sisa Profit di ($)</div>
                    
                    <!-- L1 -->
                    <input type="number" id="TS_Trigger1" step="0.1" value="10.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <input type="number" id="TS_Lock1" step="0.1" value="2.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <!-- L2 -->
                    <input type="number" id="TS_Trigger2" step="0.1" value="20.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <input type="number" id="TS_Lock2" step="0.1" value="10.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <!-- L3 -->
                    <input type="number" id="TS_Trigger3" step="0.1" value="30.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <input type="number" id="TS_Lock3" step="0.1" value="20.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <!-- L4 -->
                    <input type="number" id="TS_Trigger4" step="0.1" value="40.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <input type="number" id="TS_Lock4" step="0.1" value="30.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <!-- L5 -->
                    <input type="number" id="TS_Trigger5" step="0.1" value="50.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                    <input type="number" id="TS_Lock5" step="0.1" value="40.0" class="bg-gray-700 border border-gray-600 rounded p-2">
                </div>
            </div>

            <!-- Action Button -->
            <div class="flex items-center justify-end space-x-4">
                <span id="statusMsg" class="text-sm text-green-400 hidden">✓ Pengaturan berhasil disimpan ke Cloudflare!</span>
                <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-8 rounded-lg shadow-lg transition-colors">
                    SIMPAN PENGATURAN (PUSH TO KV)
                </button>
            </div>
        </form>
    </div>

    <script>
        // Nanti URL ini akan diganti dengan URL Cloudflare Worker asli milik Anda
        const WORKER_URL = "https://nosean-still-learning.sayxindicate.workers.dev";

        document.getElementById('botSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // Mengambil semua nilai dari form
            const configData = {
                IsBotActive: document.getElementById('IsBotActive').checked,
                LotSize: parseFloat(document.getElementById('LotSize').value),
                NumEntries: parseInt(document.getElementById('NumEntries').value),
                EmaPeriod: parseInt(document.getElementById('EmaPeriod').value),
                MagicNumber: parseInt(document.getElementById('MagicNumber').value),
                
                UseVirtualSLTP: document.getElementById('UseVirtualSLTP').checked,
                StopLossUSD: parseFloat(document.getElementById('StopLossUSD').value),
                TakeProfitUSD: parseFloat(document.getElementById('TakeProfitUSD').value),
                
                UseTrailing: document.getElementById('UseTrailing').checked,
                TS_Trigger1: parseFloat(document.getElementById('TS_Trigger1').value),
                TS_Lock1: parseFloat(document.getElementById('TS_Lock1').value),
                TS_Trigger2: parseFloat(document.getElementById('TS_Trigger2').value),
                TS_Lock2: parseFloat(document.getElementById('TS_Lock2').value),
                TS_Trigger3: parseFloat(document.getElementById('TS_Trigger3').value),
                TS_Lock3: parseFloat(document.getElementById('TS_Lock3').value),
                TS_Trigger4: parseFloat(document.getElementById('TS_Trigger4').value),
                TS_Lock4: parseFloat(document.getElementById('TS_Lock4').value),
                TS_Trigger5: parseFloat(document.getElementById('TS_Trigger5').value),
                TS_Lock5: parseFloat(document.getElementById('TS_Lock5').value),
            };

            const btn = document.querySelector('button[type="submit"]');
            const statusMsg = document.getElementById('statusMsg');
            
            btn.innerText = "MENYIMPAN...";
            btn.classList.add('opacity-50', 'cursor-not-allowed');

            try {
                /* 
                Bagian ini masih dikomentari sampai kita membuat Worker-nya
                
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(configData)
                });
                */

                // Simulasi delay jaringan (hapus ini saat sudah pakai API asli)
                await new Promise(r => setTimeout(r, 1000));
                
                console.log("Data yang akan dikirim ke Cloudflare KV:", JSON.stringify(configData, null, 2));
                
                statusMsg.classList.remove('hidden');
                setTimeout(() => statusMsg.classList.add('hidden'), 3000);
            } catch (error) {
                alert("Gagal menyimpan data!");
                console.error(error);
            } finally {
                btn.innerText = "SIMPAN PENGATURAN (PUSH TO KV)";
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
