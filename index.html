<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sanlucid MT5 Pro - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Menghilangkan panah default bawaan browser pada menu buka-tutup */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <!-- Form membungkus seluruh halaman, termasuk menu bawah -->
    <form id="botSettingsForm" class="max-w-4xl mx-auto pb-28 pt-4 px-4 md:px-8 space-y-4">
        
        <!-- SECTION 1: Pengaturan Entry (Terbuka) -->
        <details class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg group" open>
            <summary class="flex justify-between items-center font-medium cursor-pointer p-5 focus:outline-none">
                <h2 class="text-lg font-bold text-blue-400">1. Pengaturan Entry</h2>
                <span class="transition-transform duration-300 group-open:rotate-180 text-gray-400">
                    <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                </span>
            </summary>
            <div class="px-5 pb-5 pt-0 grid grid-cols-1 md:grid-cols-2 gap-4 border-t border-gray-700 mt-2 pt-4">
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">LOT SIZE</label>
                    <input type="text" inputmode="decimal" id="LotSize" placeholder="Cth: 0.01" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">JUMLAH ENTRY (LAYER)</label>
                    <input type="number" id="NumEntries" placeholder="Cth: 1" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">EMA PERIOD</label>
                    <input type="number" id="EmaPeriod" placeholder="Cth: 200" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder-gray-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-400 mb-1">MAGIC NUMBER</label>
                    <input type="number" id="MagicNumber" placeholder="Cth: 123456" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 outline-none transition-all placeholder-gray-500 text-gray-400" readonly>
                </div>
            </div>
        </details>

        <!-- SECTION 2: SL & TP (Terbuka) -->
        <details class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg group" open>
            <summary class="flex justify-between items-center font-medium cursor-pointer p-5 focus:outline-none">
                <h2 class="text-lg font-bold text-blue-400">2. Target & Risiko (USD)</h2>
                <span class="transition-transform duration-300 group-open:rotate-180 text-gray-400">
                    <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                </span>
            </summary>
            <div class="px-5 pb-5 pt-0 border-t border-gray-700 mt-2 pt-4">
                <div class="flex items-center justify-between bg-gray-700 p-3 rounded-lg mb-4">
                    <span class="text-sm font-semibold text-gray-200">Mode Ghaib (Virtual SL/TP)</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="UseVirtualSLTP" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">STOP LOSS ($)</label>
                        <input type="text" inputmode="decimal" id="StopLossUSD" placeholder="0" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-red-400 font-bold focus:ring-2 focus:ring-red-500 outline-none text-center">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-gray-400 mb-1">TAKE PROFIT ($)</label>
                        <input type="text" inputmode="decimal" id="TakeProfitUSD" placeholder="0" class="w-full bg-gray-700 border border-gray-600 rounded-lg p-2.5 text-green-400 font-bold focus:ring-2 focus:ring-green-500 outline-none text-center">
                    </div>
                </div>
            </div>
        </details>

        <!-- SECTION 3: Trailing Stop (Tertutup secara default) -->
        <details class="bg-gray-800 rounded-xl border border-gray-700 shadow-lg group">
            <summary class="flex justify-between items-center font-medium cursor-pointer p-5 focus:outline-none">
                <h2 class="text-lg font-bold text-blue-400">3. Trailing Stop</h2>
                <span class="transition-transform duration-300 group-open:rotate-180 text-gray-400">
                    <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24"><path d="M6 9l6 6 6-6"></path></svg>
                </span>
            </summary>
            <div class="px-5 pb-5 pt-0 border-t border-gray-700 mt-2 pt-4">
                <div class="flex items-center justify-between bg-gray-700 p-3 rounded-lg mb-4">
                    <span class="text-sm font-semibold text-gray-200">Aktifkan Trailing Stop</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="UseTrailing" class="sr-only peer">
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-500"></div>
                    </label>
                </div>
                
                <div class="grid grid-cols-2 gap-x-3 gap-y-2">
                    <div class="text-xs text-gray-400 font-semibold text-center mb-1">PROFIT ($)</div>
                    <div class="text-xs text-gray-400 font-semibold text-center mb-1">KUNCI DI ($)</div>
                    
                    <input type="text" inputmode="decimal" id="TS_Trigger1" placeholder="10" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    <input type="text" inputmode="decimal" id="TS_Lock1" placeholder="2" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    
                    <input type="text" inputmode="decimal" id="TS_Trigger2" placeholder="20" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    <input type="text" inputmode="decimal" id="TS_Lock2" placeholder="10" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    
                    <input type="text" inputmode="decimal" id="TS_Trigger3" placeholder="30" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    <input type="text" inputmode="decimal" id="TS_Lock3" placeholder="20" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    
                    <input type="text" inputmode="decimal" id="TS_Trigger4" placeholder="40" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    <input type="text" inputmode="decimal" id="TS_Lock4" placeholder="30" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    
                    <input type="text" inputmode="decimal" id="TS_Trigger5" placeholder="50" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                    <input type="text" inputmode="decimal" id="TS_Lock5" placeholder="40" class="bg-gray-700 border border-gray-600 rounded-lg p-2 text-center text-sm">
                </div>
            </div>
        </details>

        <!-- STICKY ACTION BAR (MENU MENGUNCI DI BAWAH) -->
        <div class="fixed bottom-0 left-0 right-0 bg-gray-900 border-t border-gray-700 p-4 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.5)] z-50">
            
            <!-- Area Notifikasi Melayang -->
            <div id="statusMsg" class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-green-600 text-white text-xs font-bold py-2 px-4 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
                ✓ Tersimpan di Cloud!
            </div>
            <div id="errorMsg" class="absolute -top-12 left-1/2 transform -translate-x-1/2 bg-red-600 text-white text-xs font-bold py-2 px-4 rounded-full shadow-lg opacity-0 transition-opacity duration-300 pointer-events-none">
                ✗ Gagal menyimpan!
            </div>

            <div class="max-w-4xl mx-auto flex items-center justify-between gap-4">
                <!-- Sakelar ON/OFF Bot -->
                <div class="flex flex-col items-center justify-center bg-gray-800 rounded-lg px-4 py-2 border border-gray-700">
                    <span class="text-[10px] font-bold text-gray-400 mb-1">BOT STATUS</span>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="IsBotActive" class="sr-only peer" checked>
                        <div class="w-11 h-6 bg-gray-600 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                    </label>
                </div>
                
                <!-- Tombol Simpan -->
                <button type="submit" id="saveBtn" class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition-colors text-sm flex justify-center items-center">
                    <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                    SIMPAN KE KV
                </button>
            </div>
        </div>
    </form>

    <script>
        const WORKER_URL = "https://nosean-still-learning.sayxindicate.workers.dev";

        const safeFloat = (id) => {
            let val = document.getElementById(id).value;
            if (!val) return 0.0;
            val = val.replace(/,/g, '.').replace(/\s/g, ''); 
            let parsed = parseFloat(val);
            return isNaN(parsed) ? 0.0 : parsed;
        };

        const safeInt = (id) => {
            let val = document.getElementById(id).value;
            if (!val) return 0;
            val = val.replace(/\s/g, ''); 
            let parsed = parseInt(val, 10);
            return isNaN(parsed) ? 0 : parsed;
        };

        const showToast = (id) => {
            const el = document.getElementById(id);
            el.classList.remove('opacity-0');
            el.classList.add('opacity-100');
            setTimeout(() => {
                el.classList.remove('opacity-100');
                el.classList.add('opacity-0');
            }, 3000);
        };

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const response = await fetch(WORKER_URL);
                if (response.ok) {
                    const data = await response.json();
                    if (Object.keys(data).length > 0) {
                        document.getElementById('IsBotActive').checked = data.IsBotActive;
                        document.getElementById('LotSize').value = data.LotSize;
                        document.getElementById('NumEntries').value = data.NumEntries;
                        document.getElementById('EmaPeriod').value = data.EmaPeriod;
                        document.getElementById('MagicNumber').value = data.MagicNumber;
                        
                        document.getElementById('UseVirtualSLTP').checked = data.UseVirtualSLTP;
                        document.getElementById('StopLossUSD').value = data.StopLossUSD;
                        document.getElementById('TakeProfitUSD').value = data.TakeProfitUSD;
                        
                        document.getElementById('UseTrailing').checked = data.UseTrailing;
                        document.getElementById('TS_Trigger1').value = data.TS_Trigger1;
                        document.getElementById('TS_Lock1').value = data.TS_Lock1;
                        document.getElementById('TS_Trigger2').value = data.TS_Trigger2;
                        document.getElementById('TS_Lock2').value = data.TS_Lock2;
                        document.getElementById('TS_Trigger3').value = data.TS_Trigger3;
                        document.getElementById('TS_Lock3').value = data.TS_Lock3;
                        document.getElementById('TS_Trigger4').value = data.TS_Trigger4;
                        document.getElementById('TS_Lock4').value = data.TS_Lock4;
                        document.getElementById('TS_Trigger5').value = data.TS_Trigger5;
                        document.getElementById('TS_Lock5').value = data.TS_Lock5;
                    }
                }
            } catch (error) {
                console.error("Belum ada data di KV", error);
            }
        });

        document.getElementById('botSettingsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const configData = {
                IsBotActive: document.getElementById('IsBotActive').checked,
                LotSize: safeFloat('LotSize'),
                NumEntries: safeInt('NumEntries'),
                EmaPeriod: safeInt('EmaPeriod'),
                MagicNumber: safeInt('MagicNumber'),
                
                UseVirtualSLTP: document.getElementById('UseVirtualSLTP').checked,
                StopLossUSD: safeFloat('StopLossUSD'),
                TakeProfitUSD: safeFloat('TakeProfitUSD'),
                
                UseTrailing: document.getElementById('UseTrailing').checked,
                TS_Trigger1: safeFloat('TS_Trigger1'),
                TS_Lock1: safeFloat('TS_Lock1'),
                TS_Trigger2: safeFloat('TS_Trigger2'),
                TS_Lock2: safeFloat('TS_Lock2'),
                TS_Trigger3: safeFloat('TS_Trigger3'),
                TS_Lock3: safeFloat('TS_Lock3'),
                TS_Trigger4: safeFloat('TS_Trigger4'),
                TS_Lock4: safeFloat('TS_Lock4'),
                TS_Trigger5: safeFloat('TS_Trigger5'),
                TS_Lock5: safeFloat('TS_Lock5'),
            };

            const btn = document.getElementById('saveBtn');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `<svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg> MEMPROSES...`;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            try {
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(configData)
                });
                
                if(response.ok) {
                    showToast('statusMsg');
                    // Format ulang UI jika ada koma diketik user
                    document.getElementById('LotSize').value = configData.LotSize;
                    document.getElementById('StopLossUSD').value = configData.StopLossUSD;
                    document.getElementById('TakeProfitUSD').value = configData.TakeProfitUSD;
                } else {
                    showToast('errorMsg');
                }
            } catch (error) {
                showToast('errorMsg');
            } finally {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        });
    </script>
</body>
</html>
