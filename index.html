<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UT Bot Command Center</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        .container { max-width: 500px; margin: 0 auto; background: #1e1e1e; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #4CAF50; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; color: #aaa; }
        input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #444; border-radius: 5px; background: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 10px; }
        button:hover { background-color: #45a049; }
        .status-box { text-align: center; padding: 10px; margin-bottom: 20px; border-radius: 5px; font-weight: bold; }
        .on { background-color: rgba(76, 175, 80, 0.2); color: #4CAF50; border: 1px solid #4CAF50; }
        .off { background-color: rgba(244, 67, 54, 0.2); color: #F44336; border: 1px solid #F44336; }
        #loading { text-align: center; color: #888; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>UT Bot Command Center</h2>
    <div id="statusIndicator" class="status-box off">Status: MEMUAT...</div>

    <form id="botForm">
        <div class="form-group">
            <label>Master Switch (ON/OFF Bot)</label>
            <select id="bot_active">
                <option value="false">🔴 OFF (Bot Berhenti)</option>
                <option value="true">🟢c ON (Bot Berjalan)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Key Value (Sensitivity)</label>
            <input type="number" id="key_value" step="0.1" required>
        </div>
        <div class="form-group">
            <label>ATR Period</label>
            <input type="number" id="atr_period" required>
        </div>
        <div class="form-group">
            <label>Lot Size</label>
            <input type="number" id="lot_size" step="0.01" required>
        </div>
        <div class="form-group">
            <label>Max Entries (Layer)</label>
            <input type="number" id="max_entries" required>
        </div>
        <div class="form-group">
            <label>Target Profit ($)</label>
            <input type="number" id="tp_dollar" step="0.1" required>
        </div>
        <div class="form-group">
            <label>Stop Loss ($)</label>
            <input type="number" id="sl_dollar" step="0.1" required>
        </div>
        <button type="submit" id="saveBtn">SIMPAN KE SERVER</button>
        <div id="loading">Memproses data...</div>
    </form>
</div>

<script>
    const workerURL = "https://nosean-still-learning.sayxindicate.workers.dev";
    
    // Fungsi mengambil data awal
    async function loadData() {
        try {
            let response = await fetch(workerURL);
            let data = await response.json();
            
            document.getElementById('bot_active').value = data.bot_active;
            document.getElementById('key_value').value = data.key_value;
            document.getElementById('atr_period').value = data.atr_period;
            document.getElementById('lot_size').value = data.lot_size;
            document.getElementById('max_entries').value = data.max_entries;
            document.getElementById('tp_dollar').value = data.tp_dollar;
            document.getElementById('sl_dollar').value = data.sl_dollar;

            updateIndicator(data.bot_active);
        } catch (error) {
            alert("Gagal terhubung ke Server Cloudflare!");
        }
    }

    function updateIndicator(isActive) {
        const ind = document.getElementById('statusIndicator');
        // Convert string to boolean for strict checking
        let active = (isActive === true || isActive === "true");
        if (active) {
            ind.className = "status-box on";
            ind.innerText = "Status Bot: SEDANG AKTIF (ON)";
        } else {
            ind.className = "status-box off";
            ind.innerText = "Status Bot: NONAKTIF (OFF)";
        }
    }

    // Fungsi menyimpan data ke server
    document.getElementById('botForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        document.getElementById('loading').style.display = "block";
        document.getElementById('saveBtn').disabled = true;

        const payload = {
            bot_active: document.getElementById('bot_active').value === "true",
            key_value: parseFloat(document.getElementById('key_value').value),
            atr_period: parseInt(document.getElementById('atr_period').value),
            lot_size: parseFloat(document.getElementById('lot_size').value),
            max_entries: parseInt(document.getElementById('max_entries').value),
            tp_dollar: parseFloat(document.getElementById('tp_dollar').value),
            sl_dollar: parseFloat(document.getElementById('sl_dollar').value)
        };

        try {
            let response = await fetch(workerURL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            let result = await response.json();
            if(result.success) {
                updateIndicator(payload.bot_active);
                alert("Konfigurasi berhasil disimpan dan akan segera dibaca oleh MT5!");
            }
        } catch (error) {
            alert("Gagal menyimpan data ke server.");
        }

        document.getElementById('loading').style.display = "none";
        document.getElementById('saveBtn').disabled = false;
    });

    // Panggil saat web dibuka
    window.onload = loadData;
</script>
</body>
</html>
